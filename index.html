<html>
  <head>
    <meta charset="utf-8">
    <title>Card Sprint</title>
    <link rel="shortcut icon" href="data:image/x-icon;" type="image/x-icon">
    <!-- We need this line below for responsiveness! -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="container">

    <div class="card-category" style="background-image: url(images/breakfast.jpg);">
      <h1>Breakfast</h1>
    </div>

    <div class="card-product">
      <img src="images/watch.jpg" alt="a stylish watch">
      <div class="product-info">
        <h2>Product name</h2>
        <p>Product description with <strong>relevant info</strong> only.</p>
      </div>
    </div>
    <div class="card-trip">
      <img src="images/travel.jpg" alt="an Italian sunset">
      <div class="trip-info">
        <div>
          <h2>Travel to Italy</h2>
          <p>Short description here!</p>
        </div>
        <h2>£179.99</h2>
      </div>
    </div>
    <!-- <h2>More text</h2> -->

    </div>
  </body>
</html>
